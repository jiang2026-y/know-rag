name: CI

# 发布用最小流水线：后端单元测试与前端类型检查。
# 不连接真实 MySQL、Redis、Elasticsearch、Neo4j 或模型 API，全部用例使用替身。
# 任意分支推送与 PR 都运行，便于先在功能分支上验证再合并。
on:
  push:
  pull_request:

jobs:
  backend-tests:
    name: 后端单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: 运行 pytest
        run: python -m pytest -q

  frontend-typecheck:
    name: 前端类型检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 类型检查
        run: npm run lint
