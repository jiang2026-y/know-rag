# LLMcopy 本地 Neo4j 服务：保存公开车型、版本、能源类型和配件关系测试数据。
services:
  neo4j:
    image: neo4j:5
    container_name: llmcopy-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "${NEO4J_AUTH}"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - llmcopy-neo4j-data:/data
      - llmcopy-neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" \"RETURN 1\""]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  llmcopy-neo4j-data:
  llmcopy-neo4j-logs:
